<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#0a0a1a"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <title>CARLO'S QUEST</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <link rel="manifest" href="manifest.json"/>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#0a0a1a; touch-action:none; }
    canvas { display:block; position:fixed; top:0; left:0; }
    #hud {
      position:fixed; top:0; left:0; right:0; z-index:10;
      padding:8px 12px; display:flex; align-items:center; gap:10px;
      background:rgba(0,0,0,0.6); font-family:'Press Start 2P',monospace;
    }
    #energyLabel { font-size:7px; color:#ffe066; white-space:nowrap; }
    #energyBarOuter { flex:1; height:12px; background:#222; border:2px solid #555; border-radius:2px; }
    #energyBarInner { height:100%; width:100%; background:linear-gradient(90deg,#e03030,#ff6644); border-radius:1px; transition:width 0.3s; }
    #powerupInfo { font-size:6px; color:#a0e0ff; white-space:nowrap; font-family:'Press Start 2P',monospace; }
    #controls {
      position:fixed; bottom:0; left:0; right:0; z-index:10;
      height:130px; display:flex; justify-content:space-between;
      align-items:flex-end; padding:0 20px 20px; pointer-events:none;
    }
    .btnGroup { display:flex; gap:10px; pointer-events:all; }
    .ctrlBtn {
      width:60px; height:60px; border-radius:50%;
      border:3px solid rgba(255,255,255,0.3); background:rgba(255,255,255,0.12);
      color:#fff; font-size:22px; display:flex; align-items:center; justify-content:center;
      cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
    }
    .ctrlBtn:active { background:rgba(255,255,255,0.3); }
    #btnPowerup { width:80px; height:80px; background:rgba(0,160,255,0.25); border-color:#60c0ff; flex-direction:column; gap:2px; }
    #powerupEmoji { font-size:28px; line-height:1; }
    #healLabel { font-size:6px; color:#fff; font-family:'Press Start 2P',monospace; line-height:1; }
    .overlay {
      position:fixed; inset:0; z-index:20;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:rgba(0,0,10,0.9); gap:20px; text-align:center; padding:20px;
      font-family:'Press Start 2P',monospace;
    }
    .overlay h1 { font-size:14px; color:#ffe066; line-height:1.8; }
    .overlay h2 { font-size:10px; color:#fff; line-height:2; }
    .overlay p  { font-size:7px; color:#aaa; line-height:2; }
    .startBtn {
      font-family:'Press Start 2P',monospace; font-size:9px;
      background:#e03030; color:#fff; border:none; padding:14px 28px;
      cursor:pointer; border-radius:3px; animation:blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity:0; } }
    .hidden { display:none !important; }
    #scanlines {
      position:fixed; inset:0; pointer-events:none; z-index:5;
      background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.07) 3px,rgba(0,0,0,0.07) 4px);
    }
  </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="scanlines"></div>
<div id="hud">
  <span id="energyLabel">ENERGY</span>
  <div id="energyBarOuter"><div id="energyBarInner"></div></div>
  <span id="powerupInfo">📱 x<span id="powerupCount">3</span></span>
</div>
<div id="controls">
  <div class="btnGroup">
    <div class="ctrlBtn" id="btnLeft">◀</div>
    <div class="ctrlBtn" id="btnRight">▶</div>
  </div>
  <div class="btnGroup">
    <div class="ctrlBtn" id="btnPowerup"><span id="powerupEmoji">📱</span><span id="healLabel">CHIAMA</span></div>
    <div class="ctrlBtn" id="btnJump">▲</div>
  </div>
</div>

<div class="overlay" id="screenStart">
  <h1>CARLO'S<br/>QUEST ♥</h1>
  <h2>LIVELLO 1<br/>DA MILANO<br/>A BERLINO</h2>
  <p>Supera gli ostacoli<br/>e raggiungi Ilia!</p>
  <button class="startBtn" id="btnStart">PRESS START</button>
</div>
<div class="overlay hidden" id="screenGameOver">
  <h1 style="color:#e03030">GAME<br/>OVER</h1>
  <p>L'energia è finita...<br/>riprova!</p>
  <button class="startBtn" id="btnRetry">RIPROVA</button>
</div>
<div class="overlay hidden" id="screenWin">
  <h1>❤️<br/>BERLINO!</h1>
  <h2>CARLO HA<br/>RAGGIUNTO<br/>ILIA!</h2>
  <button class="startBtn" id="btnNext" style="background:#2d7a27">CONTINUA ▶</button>
</div>
<div class="hidden" id="cultChoice" style="display:none;" style="position:fixed;bottom:160px;left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:30;padding:0 20px;">
  <button onclick="handleCultChoice()" style="font-family:'Press Start 2P',monospace;font-size:9px;background:#c0c0c0;color:#333;border:3px solid #888;padding:12px 16px;border-radius:4px;cursor:pointer;">NO</button>
  <button onclick="handleCultChoice()" style="font-family:'Press Start 2P',monospace;font-size:9px;background:#c0c0c0;color:#333;border:3px solid #888;padding:12px 16px;border-radius:4px;cursor:pointer;">HELL NO</button>
  <button onclick="handleCultChoice()" style="font-family:'Press Start 2P',monospace;font-size:9px;background:#c0c0c0;color:#333;border:3px solid #888;padding:12px 16px;border-radius:4px;cursor:pointer;">MA SUCA</button>
</div>
<div class="overlay hidden" id="screenL2Win">
  <h1>🏠<br/>TROVATA!</h1>
  <h2>AVETE TROVATO<br/>IL VOSTRO NIDO!</h2>
  <p>Coming soon... ♥</p>
</div>

<script>
// ── CANVAS SETUP ─────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

// W/H are plain variables, updated on resize
let W = window.innerWidth;
let H = window.innerHeight;
canvas.width  = W;
canvas.height = H;

window.addEventListener('resize', () => {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = W;
  canvas.height = H;
});

// Ground is always 78% down the screen
const GROUND_Y    = () => Math.floor(H * 0.78);
const LEVEL_WIDTH = () => W * 6;

// ── PALETTE ──────────────────────────────────────────
const C = {
  hair:'#c8920a', hairH:'#e0a800', hairS:'#7a5500',
  skin:'#fcd5a0', skinS:'#e8b888',
  shirt:'#9b1515', shirtS:'#5a0a0a',
  pants:'#1e1e1e', shoes:'#2d5a27', shoeS:'#e8e8d8',
  eyes:'#5bc8f0',  eyeD:'#0a2a5c',
  iHair:'#f07ab0', iShirt:'#1a1a1a', iPants:'#141414', iEyes:'#2a1a0e',
};

// ── STATE ─────────────────────────────────────────────
let state = 'start';
let energy=100, powerups=3, camera=0;
let obstacles=[], particles=[], bgElements=[];
let levelComplete=false, powerupCooldown=0, shake=0, callEffectTimer=0;
let player={x:0,y:0,w:28,h:48,vx:0,vy:0,onGround:false,frame:0,frameTimer:0,facing:1,invincible:0};
let ilia={x:9999,y:0,w:22,h:38,frame:0,frameTimer:0};
let leftPressed=false, rightPressed=false, jumpPressed=false, powerupPressed=false;

// ── CUTSCENE STATE ────────────────────────────────────
let cutscene = {
  active: false,
  phase: 0,      // 0=zoom-in, 1=dialog1, 2=puff, 3=dialog2, 4=carlo-hearts, 5=dialog3, 6=dialog4, 7=zoomout
  timer: 0,
  zoomScale: 1,
  zoomX: 0,
  dialogIdx: 0,
  puffParticles: [],
  iliaHairBrown: false,
};

// ── LEVEL 2 STATE ─────────────────────────────────────
let level = 1;
let iliaFollows = false;   // level 2: Ilia follows Carlo
let iliaHealCooldown = 0;
let healEffect = 0;
let levelTitle = '';
let levelTitleTimer = 0;
let snake = null;
let housePhase = 0;
let insideHouse = false;
let houseX = 0;
// Casa 2 - Culto
let house2X = 0;
let guruState = 'idle';   // idle | dialog | zoom | angry | defeated
let guruTimer = 0;
let guruDialogStep = 0;
let guruBalls = [];       // palle di luce sparate dal guru
let showCultChoice = false;
let cultChoiceSelected = false;
let insideTemple = false;
let templeExitX = 0;

const GRAVITY    = 0.55;
const JUMP_FORCE = -13;
const SPEED      = 3.5;

// ── INIT ──────────────────────────────────────────────
function initGame() {
  // Re-read dimensions at init time
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = W;
  canvas.height = H;

  energy = 100; powerups = 3; camera = 0;
  obstacles = []; particles = []; bgElements = [];
  levelComplete = false; powerupCooldown = 0; shake = 0; callEffectTimer = 0;

  const gy = GROUND_Y();

  player = { x:80, y:gy, vx:0, vy:0, w:28, h:48, onGround:true, frame:0, frameTimer:0, facing:1, invincible:0 };
  ilia   = { x:LEVEL_WIDTH()-120, y:gy, w:22, h:38, frame:0, frameTimer:0 };

  generateLevel();
  generateBg();
  updateHUD();
}

// ── LEVEL GEN ─────────────────────────────────────────
function generateLevel() {
  const lw = LEVEL_WIDTH();
  const gy = GROUND_Y();
  const pos = [lw*0.25, lw*0.5, lw*0.72];
  ['corso','pattumiera','concerto'].forEach((type,i) => {
    obstacles.push({ type, x:pos[i], y:gy, w:type==='concerto'?160:36, h:type==='concerto'?42:44, active:true, cleared:false });
  });
  obstacles.push({ type:'platform', x:pos[2]-20, y:gy-70, w:200, h:14, active:true, cleared:false });
}

function generateBg() {
  const lw = LEVEL_WIDTH();
  for (let i=0;i<80;i++) bgElements.push({type:'star',x:Math.random()*lw,y:Math.random()*H*0.5,r:Math.random()*2+0.5});
  for (let i=0;i<8;i++) {
    const h=80+Math.random()*120;
    bgElements.push({type:'building',x:100+i*320+Math.random()*80,h,w:60+Math.random()*40,color:'#1e2030',winColor:'#ffe066'});
  }
  bgElements.push({type:'duomo',x:200});
  for (let i=0;i<8;i++) {
    const h=100+Math.random()*150;
    bgElements.push({type:'building',x:lw*0.55+i*300+Math.random()*80,h,w:55+Math.random()*50,color:'#1a1e1a',winColor:'#80d0ff'});
  }
  bgElements.push({type:'tvtower',x:lw-300});
  // Torre vicino a Ilia (goal)
  bgElements.push({type:'tvtower_goal',x:lw-180});
  for (let i=0;i<4;i++) bgElements.push({type:'graffitiwall',x:lw*0.5+i*200,y:GROUND_Y()-80});
}

// ── DRAW HELPERS ──────────────────────────────────────
function r(x,y,w,h,col) { ctx.fillStyle=col; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
const sc = (x) => x - camera + (shake?(Math.random()-0.5)*shake:0);

function drawBackground() {
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#05051a'); grad.addColorStop(0.6,'#1a1040'); grad.addColorStop(1,'#2a1a10');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);

  const gy = GROUND_Y();
  if (!bgElements || !Array.isArray(bgElements)) return;
  bgElements.forEach(el => {
    const sx = el.x - camera*0.4;
    if (sx < -300 || sx > W+300) return;
    if (el.type==='star') {
      ctx.fillStyle=`rgba(255,255,255,0.5)`;
      ctx.fillRect(Math.round(el.x-camera*0.15),Math.round(el.y),el.r,el.r);
    } else if (el.type==='building') {
      const bx=Math.round(sx), by=Math.round(gy-el.h);
      r(bx,by,el.w,el.h,el.color);
      ctx.fillStyle=el.winColor;
      for (let wy=by+10;wy<gy-10;wy+=18)
        for (let wx=bx+6;wx<bx+el.w-6;wx+=14)
          if (Math.random()>0.4) ctx.fillRect(wx,wy,6,8);
    } else if (el.type==='duomo') {
      ctx.fillStyle='#151525';
      ctx.fillRect(Math.round(sx-40),gy-180,80,180);
      for (let s=-30;s<=30;s+=15) ctx.fillRect(Math.round(sx+s-3),gy-210-Math.abs(s),6,30+Math.abs(s));
      ctx.fillRect(Math.round(sx-5),gy-230,10,50);
    } else if (el.type==='tvtower') {
      ctx.fillStyle='#1a2a1a';
      ctx.fillRect(Math.round(sx-4),gy-280,8,280);
      ctx.fillStyle='#2a3a2a';
      ctx.beginPath(); ctx.arc(Math.round(sx),gy-180,22,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#80d0ff';
      ctx.fillRect(Math.round(sx-2),gy-300,4,40);
    } else if (el.type==='tvtower_goal') {
      // Torre di Alexanderplatz grande vicino a Ilia
      const tx = Math.round(sx);
      const pulse = Math.sin(Date.now()/600)*0.5+0.5;
      // base e tronco
      ctx.fillStyle='#223322';
      ctx.fillRect(tx-6, gy-340, 12, 340);
      // parte rastremata in basso
      ctx.fillStyle='#1a2a1a';
      ctx.fillRect(tx-12, gy-120, 24, 120);
      ctx.fillRect(tx-8,  gy-200, 16, 80);
      // sfera iconica
      ctx.fillStyle='#2a4a2a';
      ctx.beginPath(); ctx.arc(tx, gy-230, 32, 0, Math.PI*2); ctx.fill();
      // finestre della sfera
      ctx.fillStyle='#80d0ff';
      [[-14,-8],[-8,-16],[0,-20],[10,-16],[16,-8],[14,2],[6,10],[-6,10],[-14,2]].forEach(([wx,wy])=>{
        ctx.fillRect(tx+wx-2, gy-230+wy-2, 5, 5);
      });
      // anello decorativo sfera
      ctx.strokeStyle='#3a6a3a'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(tx, gy-230, 34, 0, Math.PI*2); ctx.stroke();
      // antenna con luce lampeggiante
      ctx.fillStyle='#1a3a1a';
      ctx.fillRect(tx-3, gy-400, 6, 70);
      ctx.fillStyle = pulse > 0.5 ? '#ff4444' : '#880000';
      ctx.beginPath(); ctx.arc(tx, gy-402, 5, 0, Math.PI*2); ctx.fill();
      // riflessi luce sulla torre
      ctx.fillStyle=`rgba(128,208,255,${0.15+pulse*0.1})`;
      ctx.fillRect(tx-6, gy-340, 3, 340);
      // label
      ctx.font='8px "Press Start 2P"'; ctx.fillStyle='#80d0ff';
      ctx.textAlign='center'; ctx.fillText('BERLIN', tx, gy-370); ctx.textAlign='left';
    } else if (el.type==='graffitiwall') {
      r(sx,el.y,180,80,'#1a1e18');
      ['#ff4488','#44ffaa','#ffcc00','#44aaff'].forEach((c,ci)=>{
        r(sx+10+ci*40,el.y+15,25,8,c);
        r(sx+15+ci*40,el.y+28,18,6,c);
      });
    }
  });

  // Ground
  r(0,gy,W,8,'#5a4a2a');
  r(0,gy+8,W,H-gy,'#3a2a1a');
  ctx.fillStyle='#4a3a1a';
  for (let tx=(-camera%32);tx<W;tx+=32) ctx.fillRect(Math.round(tx),gy,1,8);
}

function drawCarlo() {
  if (player.invincible>0 && Math.floor(player.invincible/4)%2===0) return;
  ctx.save();
  const sx = Math.round(sc(player.x));
  const sy = Math.round(player.y - player.h);
  ctx.translate(sx, sy);
  if (player.facing===-1) { ctx.translate(player.w,0); ctx.scale(-1,1); }
  const p=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);};
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(3,player.h-2,22,4);
  // shoes
  p(1,player.h-6,12,6,C.shoes); p(1,player.h-3,12,3,C.shoeS);
  p(15,player.h-6,12,6,C.shoes); p(15,player.h-3,12,3,C.shoeS);
  // pants
  p(3,player.h-20,10,16,C.pants); p(15,player.h-20,10,16,C.pants);
  // shirt
  p(1,player.h-34,26,16,C.shirt);
  p(1,player.h-34,4,14,C.shirtS+'88'); p(23,player.h-34,4,14,C.shirtS+'88');
  // arms
  const af=player.frame===1?-3:(player.frame===2?3:0);
  p(-3,player.h-32+af,5,12,C.shirt); p(-3,player.h-21+af,5,4,C.skin);
  p(26,player.h-32-af,5,12,C.shirt); p(26,player.h-21-af,5,4,C.skin);
  // neck
  p(10,player.h-38,8,5,C.skin);
  // face
  p(5,player.h-48,18,12,C.skin); p(5,player.h-37,18,3,C.skinS);
  // hair
  p(4,player.h-48,20,4,C.hair); p(2,player.h-46,24,3,C.hair);
  p(6,player.h-48,5,7,C.hairH);
  // eyes
  p(7,player.h-44,5,5,C.eyes); p(16,player.h-44,5,5,C.eyes);
  p(8,player.h-43,3,3,C.eyeD); p(17,player.h-43,3,3,C.eyeD);
  p(8,player.h-43,2,2,'#fff'); p(17,player.h-43,2,2,'#fff');
  // mouth
  p(10,player.h-38,8,2,'#c05030');
  ctx.restore();
}

function drawIlia() {
  drawIliaHair(ilia.hairBrown || false);
}
function drawIlia_orig() {
  const sx = Math.round(sc(ilia.x));
  const sy = Math.round(ilia.y - ilia.h);
  ctx.save(); ctx.translate(sx,sy);
  const p=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);};
  const wv = Math.floor(Date.now()/500)%2===0 ? -3 : 0;
  ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.fillRect(2,ilia.h,18,3);
  p(1,ilia.h-5,8,5,'#0f0f0f'); p(11,ilia.h-5,8,5,'#0f0f0f');
  p(2,ilia.h-18,8,14,C.iPants); p(12,ilia.h-18,8,14,C.iPants);
  p(1,ilia.h-28,20,12,C.iShirt);
  p(-2,ilia.h-27,4,10,C.iShirt); p(-2,ilia.h-18,4,4,C.skin);
  p(20,ilia.h-27+wv,4,10,C.iShirt); p(20,ilia.h-18+wv,4,4,C.skin);
  p(8,ilia.h-32,6,4,C.skin);
  p(4,ilia.h-38,14,8,C.skin); p(4,ilia.h-31,14,2,C.skinS);
  p(-1,ilia.h-30,4,26,C.iHair); p(19,ilia.h-30,4,26,C.iHair);
  p(2,ilia.h-38,18,4,C.iHair); p(0,ilia.h-35,22,4,C.iHair);
  p(3,ilia.h-38,4,8,'#f8a0c8');
  p(6,ilia.h-35,4,4,C.iEyes); p(13,ilia.h-35,4,4,C.iEyes);
  p(6,ilia.h-35,2,2,'#fff'); p(13,ilia.h-35,2,2,'#fff');
  p(8,ilia.h-29,6,2,'#c05848');
  ctx.restore();
}

function drawObstacle(ob) {
  if (!ob.active) return;
  const sx = Math.round(sc(ob.x));
  if (sx < -350 || sx > W+350) return;
  const sy = Math.round(ob.y - ob.h);
  if (ob.type==='platform') {
    r(sx,sy,ob.w,ob.h,'#4a3a1a'); r(sx,sy,ob.w,3,'#6a5a2a'); return;
  }
  ctx.save(); ctx.translate(sx,sy);
  const p=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);};
  const t = Date.now();

  if (ob.type==='corso') {
    // ── PROFESSORE che lancia libri ──
    const walk = Math.sin(t/300)*3;
    const armUp = Math.sin(t/400); // braccio che lancia

    // hitbox debug: r(0,0,ob.w,ob.h,'rgba(255,0,0,0.2)');

    // CORPO professore
    p(6, 2+walk, 24,4,'#5a3a10');   // tocco mortarboard
    p(2,-2+walk, 32,6,'#5a3a10');   // tesa mortarboard
    p(8, 6+walk, 20,18,'#1a3a7a');  // giacca
    p(2, 8+walk,  6,14,'#1a3a7a');  // braccio sx
    p(4, 6+walk, 28,6,'#fcd5a0');   // colletto/faccia
    p(8, 2+walk, 20,8,'#fcd5a0');   // faccia
    // occhi arrabbiati
    p(10,4+walk,5,4,'#cc2200'); p(19,4+walk,5,4,'#cc2200');
    p(10,3+walk,6,2,'#333');    p(19,3+walk,6,2,'#333'); // sopracciglia
    // bocca urla
    p(12,9+walk,8,3,'#cc2200');
    // gambe che camminano
    const legL = Math.sin(t/200)*6;
    p(8, 24+walk, 8,14+legL,'#0a1a4a');
    p(18,24+walk, 8,14-legL,'#0a1a4a');

    // BRACCIO DX che lancia - animato
    const throwAngle = Math.sin(t/350);
    const armX = 28 + throwAngle*8;
    const armY = 8 + walk - throwAngle*6;
    p(armX, armY, 6,12,'#1a3a7a');  // braccio
    p(armX+1, armY+12, 5,4,'#fcd5a0'); // mano

    // LIBRI LANCIATI (volano verso sinistra)
    const bookPhase = (t/800) % 1;
    const bookPhase2 = ((t/800)+0.5) % 1;
    const drawBook = (phase) => {

    };
    drawBook(bookPhase);
    drawBook(bookPhase2);

    ctx.font='9px "Press Start 2P"'; ctx.fillStyle='#ff4444';
    ctx.fillText('PROF!', -2,-22+walk);

  } else if (ob.type==='pattumiera') {
    // ── SACCHETTO ROTOLANTE ──
    const roll = (t/180) % (Math.PI*2);
    ctx.save();
    ctx.translate(18, 28);
    ctx.rotate(roll * 0.4);

    p(0,22,8,14,'#2a4a2a');
    p(14,0,8,6,'#1a3a1a');

    ctx.restore();
    ctx.font='9px "Press Start 2P"'; ctx.fillStyle='#88ff44';
    ctx.fillText('SPAZ!',-4,-14);

  } else if (ob.type==='concerto') {
    // ── PALCO ANNI 80 nello sfondo ──
    const stageX = -30;
    const stageY = -120;
    // palco
    p(stageX, stageY+80, 220, 40, '#2a1a0a');
    p(stageX, stageY+75, 220, 8,  '#4a3a1a');
    // tenda palco
    p(stageX,   stageY,     10, 80, '#8a0020');
    p(stageX+210,stageY,    10, 80, '#8a0020');
    p(stageX,   stageY,    220, 12, '#8a0020');
    // luci fluo anni 80 lampeggianti
    const lights = [
      {x:20, col:['#ff00ff','#00ffff','#ffff00']},
      {x:60, col:['#00ffff','#ffff00','#ff00ff']},
      {x:100,col:['#ffff00','#ff00ff','#00ffff']},
      {x:140,col:['#ff00ff','#00ffff','#ffff00']},
      {x:180,col:['#00ffff','#ffff00','#ff00ff']},
    ];
    lights.forEach(l=>{
      const li = Math.floor(t/200)%3;
      // fascio di luce
      ctx.fillStyle=l.col[li]+'44';
      ctx.beginPath();
      ctx.moveTo(stageX+l.x+5, stageY+12);
      ctx.lineTo(stageX+l.x-20, stageY+75);
      ctx.lineTo(stageX+l.x+30, stageY+75);
      ctx.closePath(); ctx.fill();
      // lampada
      p(stageX+l.x,stageY+8,10,8,l.col[li]);
    });
    // stella sul palco
    ctx.font='10px serif'; ctx.textAlign='center';

    // ── ZOMBIE che ballano ──
    const zombies = [

      {x:126,skin:'#6a9a5a', hair:'#334433', shirt:'#3a5a3a'},

    zombies.forEach(z=>{

      p(z.x+20, -28+j+sway, 6,18, z.shirt); // braccio dx alzato
      p(z.x-4, -10+j, 5,4, z.skin);    // mano sx

      p(z.x,   -36+j, 4,4,  z.hair);
      p(z.x+18,-36+j, 4,4,  z.hair);

      p(z.x+12,-30+j, 4,3,'#ff2200');

}

function drawParticles() {
  particles = particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    ctx.globalAlpha=p.life/p.maxLife;
    ctx.fillStyle=p.color;
    ctx.fillRect(Math.round(sc(p.x)),Math.round(p.y),p.size,p.size);
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.2; p.life--;
  });
  ctx.globalAlpha=1;
}

function spawnParticles(x,y,color,n=12) {
  for (let i=0;i<n;i++) particles.push({
    x,y,color,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6-3,
    size:3+Math.random()*4,life:30+Math.random()*20,maxLife:50
  });
}

function drawHeart(x,y,s,col) {
  ctx.fillStyle=col;
  [[0,0],[s,0],[-s,0],[0,s],[s,s],[-s,s],[0,s*2]].forEach(([dx,dy])=>ctx.fillRect(x+dx-s/2,y+dy,s,s));
}

function drawCallEffect() {
  if (callEffectTimer<=0) return;
  callEffectTimer--;
  const alpha=Math.min(1,callEffectTimer/30);
  ctx.save(); ctx.globalAlpha=alpha;
  const cx=W/2, cy=H/2;
  r(cx-65,cy-90,130,110,'#001a33');
  ctx.strokeStyle='#60c0ff'; ctx.lineWidth=3;
  ctx.strokeRect(cx-65,cy-90,130,110);
  r(cx-15,cy-80,30,8,C.iHair); r(cx-18,cy-74,36,6,C.iHair);
  r(cx-14,cy-68,28,22,C.skin);
  r(cx-8,cy-62,6,6,C.iEyes); r(cx+2,cy-62,6,6,C.iEyes);
  r(cx-8,cy-62,2,2,'#fff'); r(cx+2,cy-62,2,2,'#fff');
  ctx.fillStyle='#60c0ff'; ctx.font='6px "Press Start 2P"'; ctx.textAlign='center';
  ctx.fillText('ILIA ♥',cx,cy-14);
  ctx.fillText('+100 ENERGIA!',cx,cy+2);
  ctx.globalAlpha=1; ctx.restore(); ctx.textAlign='left';
}

// ── UPDATE ────────────────────────────────────────────
function update() {
  if (state==='cutscene') { updateCutscene(); return; }
  if (state==='win2') return;
  if (state!=='playing') return;
  if (level===2) { updateLevel2(); return; }
  if (shake>0) shake-=0.5;
  if (powerupCooldown>0) powerupCooldown--;
  if (player.invincible>0) player.invincible--;

  // movement
  player.vx=0;
  if (leftPressed)  { player.vx=-SPEED; player.facing=-1; }
  if (rightPressed) { player.vx= SPEED; player.facing= 1; }
  player.vy+=GRAVITY;
  player.x+=player.vx;
  player.y+=player.vy;

  // ground
  const gy=GROUND_Y();
  if (player.y>=gy) { player.y=gy; player.vy=0; player.onGround=true; }
  else player.onGround=false;
  if (player.x<10) player.x=10;

  // platforms
  obstacles.filter(o=>o.type==='platform'&&o.active).forEach(pl=>{
    if (player.x+player.w>pl.x && player.x<pl.x+pl.w &&
        player.y>pl.y-pl.h && player.y-pl.h<pl.y && player.vy>=0) {
      player.y=pl.y; player.vy=0; player.onGround=true;
    }
  });

  // jump - non interferisce col movimento orizzontale
  if (jumpPressed && player.onGround) {
    player.vy=JUMP_FORCE; player.onGround=false;
  }
  if (!player.onGround) jumpPressed=false;

  // animate
  if (player.vx!==0) {
    player.frameTimer++;
    if (player.frameTimer>8) { player.frame=(player.frame+1)%3; player.frameTimer=0; }
  } else player.frame=0;

  // powerup
  if (powerupPressed && powerups>0 && powerupCooldown===0) {
    powerupPressed=false; powerups--; energy=100; powerupCooldown=120; shake=0;
    callEffectTimer=120;
    spawnParticles(player.x+14,player.y,  '#60c0ff',30);
  }

  // obstacle collisions
  // Coordinate: player.y = bottom del player, player.y-player.h = top del player
  // ob.y = bottom dell'ostacolo, ob.y-ob.h = top dell'ostacolo
  obstacles.forEach(ob=>{
    if (!ob.active||ob.type==='platform') return;

    const pLeft  = player.x;
    const pRight = player.x + player.w;
    const pTop   = player.y - player.h;
    const pBot   = player.y;

    const oLeft  = ob.x;
    const oRight = ob.x + ob.w;
    const oTop   = ob.y - ob.h;
    const oBot   = ob.y;

    const overlapX = pRight > oLeft+4 && pLeft < oRight-4;
    const overlapY = pBot > oTop+4 && pTop < oBot-4;

    if (overlapX && overlapY && player.invincible===0) {
      // stomping dall'alto: Carlo salta sul nemico
      const stomping = player.vy > 0 && pBot < oTop + 20;
      if (ob.type==='corso' && stomping) {
        // sconfigge il professore saltandoci sopra
        ob.active = false;
        player.vy = JUMP_FORCE * 0.7;
        spawnParticles(ob.x+ob.w/2, ob.y-ob.h/2, '#ffe066', 25);
      } else if (ob.type==='concerto' && stomping) {
        // rimbalza sulla folla
        player.vy = JUMP_FORCE * 0.5;
        energy -= 5;
        player.invincible = 30;
        spawnParticles(player.x+14, pBot, '#ff8844', 10);
        if (energy<=0) { energy=0; gameOver(); }
      } else {
        // colpito di lato
        energy -= ob.type==='concerto' ? 10 : 20;
        player.invincible = 80;
        shake = 8;
        spawnParticles(player.x+14, player.y-player.h/2, '#ff4444', 15);
        if (energy<=0) { energy=0; gameOver(); }
      }
    }

    // superato l'ostacolo
    if (!ob.cleared && player.x > ob.x+ob.w+10) {
      ob.cleared=true;
      spawnParticles(ob.x+ob.w/2, ob.y-ob.h/2, '#ffe066', 20);
    }
  });

  // camera
  const targetCam=player.x-W*0.3;
  camera+=(targetCam-camera)*0.1;
  camera=Math.max(0,Math.min(camera,LEVEL_WIDTH()-W));

  // ilia wave
  ilia.frameTimer++; if (ilia.frameTimer>20){ilia.frame=(ilia.frame+1)%2;ilia.frameTimer=0;}

  // win
  if (ilia.x-(player.x+player.w)<40&&!levelComplete) {
    levelComplete=true;
    setTimeout(()=>{ document.getElementById('screenWin').classList.remove('hidden'); state='win'; },800);
  }

  updateHUD();
}

function updateHUD() {
  const bar=document.getElementById('energyBarInner');
  bar.style.width=energy+'%';
  bar.style.background=energy<30?'linear-gradient(90deg,#ffaa00,#ffcc44)':'linear-gradient(90deg,#e03030,#ff6644)';
  if (level===1) {
    const pc = document.getElementById('powerupInfo');
    if (pc) pc.innerHTML='📱 x<span id="powerupCount">'+powerups+'</span>';
  } else {
    const pc = document.getElementById('powerupInfo');
    if (pc) pc.innerHTML = (l2 && l2.healCooldown>0) ? '💋 ricarica...' : '💋 BACIO';
  }
}

function gameOver() {
  state='gameover';
  document.getElementById('screenGameOver').classList.remove('hidden');
}

// ── RENDER ────────────────────────────────────────────
function render() {
  ctx.clearRect(0,0,W,H);
  if (state==='cutscene') { drawCutscene(); return; }
  if (level===2) { drawL2(); return; }
  drawBackground();
  if (state==='playing'||state==='win') {
    // distance indicator
    if (state==='playing') {
      const dist=Math.max(0,Math.floor((ilia.x-player.x)/10));
      ctx.font='10px "Press Start 2P"'; ctx.fillStyle='#ffe066';
      ctx.textAlign='right'; ctx.fillText('BERLINO '+dist+'m ▶',W-12,95); ctx.textAlign='left';
      // city label
      const prog=camera/(LEVEL_WIDTH()-W);
      ctx.font='11px "Press Start 2P"'; ctx.textAlign='center';
      ctx.fillStyle=prog<0.4?'#aaaacc':'#aaccaa';
      ctx.fillText(prog<0.4?'★ MILANO ★':'★ BERLINO ★',W/2,112); ctx.textAlign='left';
    }
    obstacles.forEach(drawObstacle);
    drawParticles();
    drawIlia();
    const hb=Math.sin(Date.now()/400)*2;
    drawHeart(Math.round(sc(ilia.x+11)),Math.round(ilia.y-ilia.h-20+hb),4,'#ff4488');
    drawCarlo();
    drawCallEffect();
  }
}

function loop() { update(); render(); requestAnimationFrame(loop); }

// CUTSCENE
// ═══════════════════════════════════════════════════════
function startCutscene() {
  state = 'cutscene';
  cutscene.active = true;
  cutscene.phase = 0;
  cutscene.timer = 0;
  cutscene.zoomScale = 1;
  cutscene.iliaHairBrown = false;
  // Position characters for cutscene
  player.x = ilia.x - 60;
  player.y = GROUND_Y();
  player.facing = 1;
  camera = Math.max(0, player.x - W*0.4);
}

const DIALOGS = [
  { who:'ILIA',  text:'Sei arrivato da me,\nmio prode Carlo!' },
  { who:'ILIA',  text:'Adesso posso assumere\nla mia forma finale...' },
  { who:'ILIA',  text:'Sai cosa dobbiamo\nfare adesso?' },
  { who:'CARLO', text:'.....' },
  { who:'ILIA',  text:'Trovare un\nnido adatto!' },
];
let dialogStep = 0;
let heartBubbles = [];  // cuoricini bollicine intorno a Carlo

function spawnHeartBubbles() {
  heartBubbles = [];
  const colors = ['#ff88bb','#ff44aa','#ffaad4','#ff66cc','#ffccee','#ee2299'];
  for (let i = 0; i < 10; i++) {
    // Distribuiti in semicerchio SOPRA la testa
    const angle = Math.PI + (i / 9) * Math.PI; // da 180° a 360° (sopra)
    const dist = 22 + Math.random() * 20;
    heartBubbles.push({
      ox: Math.cos(angle) * dist,
      oy: Math.sin(angle) * dist - 10, // offset extra verso su
      phase: Math.random() * Math.PI * 2,
      size: 4 + Math.random() * 5,
      color: colors[Math.floor(Math.random() * colors.length)],
      speed: 0.4 + Math.random() * 0.3,
      popped: false,
      popTimer: 60 + Math.floor(Math.random() * 60),
    });
  }
}

function updateHeartBubbles(timer) {
  heartBubbles.forEach(b => {
    if (b.popped) return;
    if (timer >= b.popTimer) {
      b.popped = true;
      b.life = 0;
    }
  });
  // respawn se tutte scoppiate
  if (heartBubbles.length > 0 && heartBubbles.every(b => b.popped)) {
    spawnHeartBubbles();
  }
}

function drawHeartBubbles() {
  if (heartBubbles.length === 0) return;
  const t = Date.now() / 1000;
  // Centro testa di Carlo nel canvas (coordinata schermo)
  // Durante la cutscene il canvas è zoomato — usiamo W/2 come centro Carlo
  const carloScreenX = Math.round(W * 0.38);
  const carloScreenY = Math.round(H * 0.42);

  heartBubbles.forEach(b => {
    if (b.popped) return;
    const bx = carloScreenX + b.ox + Math.sin(t * b.speed * 3 + b.phase) * 5;
    const by = carloScreenY + b.oy + Math.cos(t * b.speed * 2 + b.phase) * 4;
    const s = Math.round(b.size);

    // Disegna cuoricino pixel (5x4 px scalato)
    ctx.fillStyle = b.color;
    // riga 1: due bumps
    ctx.fillRect(bx-s+1, by-s, s-1, s-1);
    ctx.fillRect(bx+1,   by-s, s-1, s-1);
    // riga 2: largo
    ctx.fillRect(bx-s,   by-1, s*2, s);
    // riga 3: si stringe
    ctx.fillRect(bx-s+1, by+s-1, s*2-2, s-1);
    // riga 4: punta
    ctx.fillRect(bx,     by+s*2-2, s, s-1);

    // cerchietto trasparente (bolla)
    ctx.strokeStyle = b.color + '88';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(bx, by, b.size + 3, 0, Math.PI * 2);
    ctx.stroke();
  });
}
// Fasi:
// 0: zoom in (auto)
// 1: dialog "Sei arrivato..." → TAP
// 2: dialog "Adesso posso assumere..." → TAP
// 3: PUFF trasformazione (auto ~2s)
// 4: Carlo cuori (auto ~1.5s)
// 5: dialog "Sai cosa dobbiamo fare?" → TAP
// 6: dialog "....." → TAP
// 7: dialog "Trovare un nido!" → TAP
// 8: zoom out (auto)

function updateCutscene() {
  cutscene.timer++;
  const t = cutscene.timer;

  if (cutscene.phase === 0) {
    cutscene.zoomScale += (2.2 - cutscene.zoomScale) * 0.04;
    if (t > 80) { cutscene.phase = 1; cutscene.timer = 0; }
  }
  else if (cutscene.phase === 1) {
    // Attende TAP — nessun avanzamento automatico
  }
  else if (cutscene.phase === 2) {
    // Attende TAP
  }
  else if (cutscene.phase === 3) {
    // PUFF automatico
    if (t === 1) {
      for (let i=0;i<40;i++) cutscene.puffParticles.push({
        x: ilia.x+11, y: ilia.y-30,
        vx:(Math.random()-0.5)*5, vy:(Math.random()-0.5)*5-2,
        life:60, maxLife:60, size:4+Math.random()*6,
        color:['#f07ab0','#fff','#ffe0f0','#ffaacc'][Math.floor(Math.random()*4)]
      });
    }
    cutscene.puffParticles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life--;});
    cutscene.puffParticles = cutscene.puffParticles.filter(p=>p.life>0);
    if (t > 30) cutscene.iliaHairBrown = true;
    if (t > 100) { cutscene.phase = 4; cutscene.timer = 0; }
  }
  else if (cutscene.phase === 4) {
    // Carlo cuori bollicine automatico
    if (t === 1) spawnHeartBubbles();
    updateHeartBubbles(t);
    if (t > 100) { heartBubbles = []; cutscene.phase = 5; cutscene.timer = 0; }
  }
  else if (cutscene.phase === 5) { /* TAP */ }
  else if (cutscene.phase === 6) { /* TAP */ }
  else if (cutscene.phase === 7) { /* TAP */ }
  else if (cutscene.phase === 8) {
    cutscene.zoomScale += (1 - cutscene.zoomScale) * 0.05;
    if (t > 80) { endCutsceneStartLevel2(); }
  }
}

function drawCutscene() {
  // Draw world underneath zoomed
  ctx.save();
  const zs = cutscene.zoomScale;
  const cx = (ilia.x + player.x)/2 - camera;
  const cy = GROUND_Y() - 40;
  ctx.translate(W/2, H/2);
  ctx.scale(zs, zs);
  ctx.translate(-cx, -cy);

  drawBackground();
  obstacles.forEach(drawObstacle);
  // draw Ilia with brown/pink hair based on phase
  drawIliaHair(cutscene.iliaHairBrown);
  drawCarlo();

  // puff particles
  cutscene.puffParticles.forEach(p=>{
    ctx.globalAlpha = p.life/p.maxLife;
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x-camera), Math.round(p.y), p.size, p.size);
  });
  ctx.globalAlpha = 1;
  ctx.restore();

  // Carlo bubble hearts (phase 4-7)
  if (cutscene.phase >= 4 && cutscene.phase < 8) {
    drawHeartBubbles();
  }

  // Dialog box
  let dlg = null;
  if (cutscene.phase === 1) dlg = DIALOGS[0];
  else if (cutscene.phase === 2) dlg = DIALOGS[1];
  else if (cutscene.phase === 5) dlg = DIALOGS[2];
  else if (cutscene.phase === 6) dlg = DIALOGS[3];
  else if (cutscene.phase === 7) dlg = DIALOGS[4];

  if (dlg) {
    const bx=20, by=60, bw=W-40, bh=120;
    ctx.fillStyle='rgba(0,0,10,0.92)'; ctx.fillRect(bx,by,bw,bh);
    ctx.strokeStyle='#ffe066'; ctx.lineWidth=2; ctx.strokeRect(bx,by,bw,bh);
    ctx.font='8px "Press Start 2P"';
    ctx.fillStyle='#ffe066'; ctx.fillText(dlg.who+':',bx+12,by+22);
    ctx.fillStyle='#fff';
    dlg.text.split('\n').forEach((line,i)=>{
      ctx.fillText(line, bx+12, by+44+i*22);
    });
    // tap to continue hint
    if (cutscene.timer % 40 < 20) {
      ctx.font='6px "Press Start 2P"'; ctx.fillStyle='#888';
      ctx.textAlign='right'; ctx.fillText('tocca per continuare ▶', bx+bw-10, by+bh-10);
      ctx.textAlign='left';
    }
  }
}

// Tap per guru dialog in livello 2
canvas.addEventListener('click', ()=>{ handleGuruTap(); });

// Tap to advance cutscene dialogs
canvas.addEventListener('click', ()=>{
  if (state !== 'cutscene') return;
  const p = cutscene.phase;
  // Solo le fasi TAP avanzano al tocco (min 20 frame per evitare doppi tap)
  if (p === 1 && cutscene.timer > 20) { cutscene.phase=2; cutscene.timer=0; }
  else if (p === 2 && cutscene.timer > 20) { cutscene.phase=3; cutscene.timer=0; }
  else if (p === 5 && cutscene.timer > 20) { cutscene.phase=6; cutscene.timer=0; }
  else if (p === 6 && cutscene.timer > 20) { cutscene.phase=7; cutscene.timer=0; }
  else if (p === 7 && cutscene.timer > 20) { cutscene.phase=8; cutscene.timer=0; }
});

function endCutsceneStartLevel2() {
  state = 'playing';
  cutscene.active = false;
  level = 2;
  iliaFollows = true;
  initLevel2();
}

// ═══════════════════════════════════════════════════════
// LEVEL 2
// ═══════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════
// LIVELLO 2 — FINDING A NEST
// ═══════════════════════════════════════════════════════════════

// Costanti livello 2
const L2_WORLD = () => W * 9;      // larghezza mondo
const L2_GY    = () => Math.floor(H * 0.78); // suolo

// Stato livello 2
let l2 = {
  // snake
  snakeX: 0, snakeVx: 1.8, snakeActive: false,
  house1X: 0, house1Entered: false,
  // tempio
  templeX: 0, templeW: 0,
  templeEntered: false,
  // guru
  guruState: 'idle',  // idle | dialog | choice | angry | done
  guruDialog: 0,
  guruBalls: [],
  guruBallTimer: 0,
  // heal
  healCooldown: 0, healEffect: 0,
  // title
  titleTimer: 180,
  // choice UI
  choiceVisible: false,
};

function initLevel2() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
  energy = 100; camera = 0;
  obstacles = []; particles = []; bgElements = [];
  levelComplete = false; shake = 0;

  const gy = L2_GY();
  player.x = 60; player.y = gy;
  player.vx = 0; player.vy = 0;
  player.onGround = true; player.invincible = 0; player.facing = 1;
  player.frame = 0; player.frameTimer = 0;

  ilia.x = player.x - 55; ilia.y = gy; ilia.hairBrown = true;

  l2.house1X   = Math.floor(W * 1.8);
  l2.templeX   = Math.floor(W * 4.5);
  l2.templeW   = Math.floor(W * 2.2);
  l2.snakeX    = l2.house1X + 180;
  l2.snakeVx   = 1.8;
  l2.snakeActive = false;
  l2.house1Entered = false;
  l2.templeEntered = false;
  l2.guruState = 'idle';
  l2.guruDialog = 0;
  l2.guruBalls = [];
  l2.guruBallTimer = 0;
  l2.healCooldown = 0;
  l2.healEffect = 0;
  l2.titleTimer = 180;
  l2.choiceVisible = false;

  // Update button
  const em = document.getElementById('powerupEmoji');
  const hl = document.getElementById('healLabel');
  if (em) em.textContent = '💋';
  if (hl) hl.textContent = 'BACIO';
  updateHUD();
}

function updateLevel2() {
  if (state !== 'playing' || level !== 2) return;

  const gy = L2_GY();
  const lw = L2_WORLD();
  if (shake > 0) shake -= 0.5;
  if (l2.healCooldown > 0) l2.healCooldown--;
  if (l2.healEffect > 0) l2.healEffect--;
  if (l2.titleTimer > 0) l2.titleTimer--;

  // ── Movimento Carlo ──
  player.vx = 0;
  if (leftPressed)  { player.vx = -SPEED; player.facing = -1; }
  if (rightPressed) { player.vx =  SPEED; player.facing =  1; }
  player.vy += GRAVITY;
  player.x  += player.vx;
  player.y  += player.vy;
  if (player.y >= gy) { player.y = gy; player.vy = 0; player.onGround = true; }
  else player.onGround = false;
  if (player.x < 10) player.x = 10;
  if (jumpPressed && player.onGround) { player.vy = JUMP_FORCE; player.onGround = false; }
  if (!player.onGround) jumpPressed = false;
  if (player.vx !== 0) {
    player.frameTimer++;
    if (player.frameTimer > 8) { player.frame = (player.frame+1)%3; player.frameTimer = 0; }
  } else player.frame = 0;
  if (player.invincible > 0) player.invincible--;

  // ── Ilia segue (solo fuori dal tempio) ──
  if (!l2.templeEntered) {
    ilia.x += (player.x - 55 - ilia.x) * 0.08;
    ilia.y = gy;
  }

  // ── Heal ──
  if (powerupPressed && l2.healCooldown === 0 && energy < 100) {
    energy = Math.min(100, energy + 40);
    l2.healCooldown = 180;
    l2.healEffect = 90;
    spawnParticles(ilia.x+11, ilia.y-30, '#ff88aa', 20);
  }
  powerupPressed = false;

  // ── Camera ──
  let maxCam = lw - W;
  // Se siamo fuori dal tempio, blocca la camera prima del tempio
  if (!l2.templeEntered) {
    maxCam = Math.min(maxCam, l2.templeX - W * 0.45);
  }
  if (!l2.templeEntered && player.x + player.w > l2.templeX) {
    player.x = l2.templeX - player.w;
    player.vx = 0;
  }
  const targetCam = player.x - W * 0.35;
  camera += (targetCam - camera) * 0.1;
  camera = Math.max(0, Math.min(camera, maxCam));

  // ── Serpente (dentro casa 1) ──
  if (!l2.house1Entered && player.x > l2.house1X) {
    l2.house1Entered = true;
    l2.snakeActive = true;
  }
  if (l2.snakeActive) {
    l2.snakeX += l2.snakeVx;
    if (l2.snakeX < l2.house1X + 10)  l2.snakeVx =  Math.abs(l2.snakeVx);
    if (l2.snakeX > l2.house1X + 280) l2.snakeVx = -Math.abs(l2.snakeVx);
    // Collisione
    const sL = l2.snakeX, sR = l2.snakeX + 60;
    const sT = gy - 22, sB = gy + 2;
    const pL = player.x, pR = player.x + player.w;
    const pT = player.y - player.h, pB = player.y;
    if (pR > sL && pL < sR && pB > sT && pT < sB && player.invincible === 0) {
      energy -= 12; player.invincible = 80; shake = 6;
      spawnParticles(player.x+14, player.y-20, '#88ff44', 12);
      if (energy <= 0) { energy = 0; gameOver(); }
    }
    // Esce dalla casa verso sinistra -> snake sparisce
    if (l2.house1Entered && player.x < l2.house1X - 20) {
      l2.snakeActive = false;
      l2.house1Entered = false;
    }
  }

  // ── Entrata tempio: porta centrale ──
  // La porta è al centro del tempio (templeX + templeW/2)
  // Carlo deve avvicinarsi al muro (bloccato sopra) e premere avanti
  // Quando è sulla porta (entro 40px dal centro) viene teletrasportato dentro
  if (!l2.templeEntered) {
    const doorCX = l2.templeX + Math.floor(l2.templeW / 2);
    const distToDoor = Math.abs((player.x + player.w/2) - doorCX);
    if (distToDoor < 50 && rightPressed) {
      l2.templeEntered = true;
      player.x = 80; player.y = gy;
      player.vx = 0; player.vy = 0;
      camera = 0;
    }
  }

  // ── Dentro tempio ──
  if (l2.templeEntered) {
    // Muri stanza
    if (player.x < 20) player.x = 20;
    if (player.x + player.w > W - 20) player.x = W - player.w - 20;

    // Guru dialog auto-start
    if (l2.guruState === 'idle') l2.guruState = 'dialog';

    // Palle guru
    if (l2.guruState === 'angry') {
      l2.guruBallTimer++;
      if (l2.guruBallTimer % 55 === 0 && l2.guruBalls.length < 6) {
        const gx = W * 0.65, gy2 = gy - 100;
        const dx = (player.x + 14) - gx;
        const dy = (player.y - player.h/2) - gy2;
        const d  = Math.sqrt(dx*dx + dy*dy) || 1;
        l2.guruBalls.push({ x: gx, y: gy2, vx: dx/d*4, vy: dy/d*4, life: 200, trail: [] });
      }
      l2.guruBalls = l2.guruBalls.filter(b => b.life > 0);
      l2.guruBalls.forEach(b => {
        b.trail.push({x:b.x, y:b.y});
        if (b.trail.length > 7) b.trail.shift();
        // leggero homing
        const dx = (player.x+14) - b.x, dy = (player.y-player.h/2) - b.y;
        const d  = Math.sqrt(dx*dx+dy*dy) || 1;
        b.vx += dx/d * 0.12; b.vy += dy/d * 0.12;
        const spd = Math.sqrt(b.vx*b.vx+b.vy*b.vy);
        if (spd > 5) { b.vx = b.vx/spd*5; b.vy = b.vy/spd*5; }
        b.x += b.vx; b.y += b.vy;
        if (b.y > gy - 8) { b.y = gy - 8; b.vy *= -0.6; }
        b.life--;
        // Collisione
        const dist = Math.sqrt((b.x-(player.x+14))**2+(b.y-(player.y-player.h/2))**2);
        if (dist < 16 && player.invincible === 0) {
          energy -= 15; player.invincible = 80; shake = 8; b.life = 0;
          spawnParticles(player.x+14, player.y-20, '#ffffff', 15);
          if (energy <= 0) { energy = 0; gameOver(); }
        }
      });
    }

    // Uscita dalla porta sinistra
    if (player.x < 30 && l2.guruState === 'angry') {
      l2.templeEntered = false;
      l2.guruState = 'done';
      l2.guruBalls = [];
      player.x = l2.templeX - 60;
      camera = Math.max(0, player.x - W * 0.4);
      spawnParticles(player.x+14, player.y-20, '#ffe066', 40);
      setTimeout(()=>{
        document.getElementById('screenL2Win').classList.remove('hidden');
        state = 'win2';
      }, 800);
    }
    // Può uscire anche prima di parlare col guru
    if (player.x < 30 && (l2.guruState === 'idle' || l2.guruState === 'dialog')) {
      l2.templeEntered = false;
      player.x = l2.templeX - 60;
      camera = Math.max(0, player.x - W * 0.4);
    }
  }

  updateHUD();
}

// tap canvas per guru dialog
function handleGuruTap() {
  if (level !== 2 || !l2.templeEntered) return;
  if (l2.guruState === 'dialog') {
    if (l2.guruDialog < 1) { l2.guruDialog++; }
    else { l2.guruState = 'choice'; showCultChoiceUI(true); }
  }
}

function showCultChoiceUI(show) {
  l2.choiceVisible = show;
  const d = document.getElementById('cultChoice');
  if (d) d.style.display = show ? 'flex' : 'none';
}

function handleCultChoice() {
  showCultChoiceUI(false);
  setTimeout(() => {
    l2.guruState = 'angry';
    l2.guruBallTimer = 0;
    shake = 12;
    spawnParticles(W*0.65, L2_GY()-80, '#ff4400', 30);
  }, 300);
}

// ── DRAW LIVELLO 2 ──────────────────────────────────────
function drawL2() {
  const gy = L2_GY();
  if (!l2.templeEntered) {
    drawL2World(gy);
  } else {
    drawL2Temple(gy);
  }
}

function drawL2World(gy) {
  // Cielo
  const grad = ctx.createLinearGradient(0,0,0,gy);
  grad.addColorStop(0,'#87ceeb'); grad.addColorStop(0.8,'#d0eeff'); grad.addColorStop(1,'#c0e890');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,gy);

  // Sole
  ctx.fillStyle = '#ffe566';
  ctx.beginPath(); ctx.arc(W*0.15, 60, 26, 0, Math.PI*2); ctx.fill();

  // Nuvole (parallax leggero)
  [[W*0.3,50,100],[W*0.6,35,80],[W*1.2-camera*0.1,45,70]].forEach(([cx,cy,cw])=>{
    const scx = cx - camera*0.08;
    if (scx < -120 || scx > W+120) return;
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.beginPath(); ctx.arc(scx,      cy,   22, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(scx+cw*0.3,cy-8, 28, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(scx+cw*0.6,cy,   20, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(scx-5, cy, cw*0.65, 22);
  });

  // Uccelli (semplici)
  const bt = Date.now()/1000;
  [W*0.4, W*0.7, W*1.0].forEach((bx,i)=>{
    const sx = bx - camera*0.05;
    if (sx < 0 || sx > W) return;
    const by = 55+i*18 + Math.sin(bt*1.2+i)*6;
    const wing = Math.sin(bt*4+i)*5;
    ctx.strokeStyle='#444'; ctx.lineWidth=1.5; ctx.beginPath();
    ctx.moveTo(sx,by); ctx.quadraticCurveTo(sx-8,by-wing,sx-16,by);
    ctx.moveTo(sx,by); ctx.quadraticCurveTo(sx+8,by-wing,sx+16,by);
    ctx.stroke();
  });

  // Terreno
  ctx.fillStyle='#5a8a30'; ctx.fillRect(0,gy,W,8);
  ctx.fillStyle='#3a6a18'; ctx.fillRect(0,gy+8,W,H-gy-8);
  ctx.fillStyle='#4a7a20';
  for(let tx=(-camera%40);tx<W;tx+=40) ctx.fillRect(Math.round(tx),gy,2,8);

  // Casa 1 (con serpente)
  const h1sx = Math.round(l2.house1X - camera);
  if (h1sx > -250 && h1sx < W+250) drawL2House1(h1sx, gy);

  // Colonne di transizione
  for (let i=0; i<5; i++) {
    const colX = l2.house1X + 320 + i*200;
    const csx = Math.round(colX - camera);
    if (csx < -30 || csx > W+30) continue;
    const ch = 70 + (i%2)*40;
    const broken = i%2===1;
    ctx.fillStyle='#d0c8b8';
    ctx.fillRect(csx-7, gy-ch, 14, ch);
    if (!broken) {
      ctx.fillStyle='#bbb'; ctx.fillRect(csx-12, gy-ch, 24, 8);
    } else {
      ctx.fillStyle='#aaa8'; ctx.fillRect(csx-10, gy-(ch*0.6)|0, 20, 6);
      ctx.fillStyle='#b8b0a0'; ctx.fillRect(csx-16, gy-8, 12, 8); ctx.fillRect(csx+4,gy-6,16,6);
    }
  }

  // Tempio (muro che blocca)
  const tsx = Math.round(l2.templeX - camera);
  if (tsx < W+300 && tsx > -l2.templeW-50) drawL2TempleExterior(tsx, gy);

  // Hint porta
  if (player.x > l2.templeX - W*0.35) {
    ctx.font='8px "Press Start 2P"'; ctx.fillStyle='#ffe066'; ctx.textAlign='center';
    if (Math.floor(Date.now()/500)%2===0) ctx.fillText('▶ TIENI DESTRA SULLA PORTA ◀', W/2, gy-16);
    ctx.textAlign='left';
  }

  // Particelle, Ilia, Carlo
  drawParticles();
  if (l2.snakeActive) drawL2Snake(gy);
  drawIliaHair(true);
  if (l2.healEffect>0) {
    const alpha=Math.min(1,l2.healEffect/30);
    ctx.save(); ctx.globalAlpha=alpha;
    ctx.font='10px "Press Start 2P"'; ctx.fillStyle='#ff4488'; ctx.textAlign='center';
    ctx.fillText('*CHU* ♥', Math.round(sc(ilia.x+11)), Math.round(ilia.y-ilia.h-25-(90-l2.healEffect)*0.3));
    ctx.textAlign='left'; ctx.restore();
  }
  drawCarlo();

  // Titolo livello
  if (l2.titleTimer > 0) {
    const alpha = Math.min(1, l2.titleTimer/30);
    ctx.save(); ctx.globalAlpha=alpha;
    ctx.font='13px "Press Start 2P"'; ctx.fillStyle='#ffe066'; ctx.textAlign='center';
    ctx.fillText('FINDING A NEST', W/2, H/2-10); ctx.textAlign='left'; ctx.restore();
  }
}

function drawL2House1(sx, gy) {
  const HW=220, HH=220;
  // Piano 1
  ctx.fillStyle='#6a5a4a'; ctx.fillRect(sx,gy-80,HW,80);
  // Piano 2
  ctx.fillStyle='#7a6a5a'; ctx.fillRect(sx+10,gy-160,HW-20,80);
  // Piano 3
  ctx.fillStyle='#8a7a6a'; ctx.fillRect(sx+20,gy-230,HW-40,70);
  // Tetto
  ctx.fillStyle='#4a3a2a';
  ctx.beginPath(); ctx.moveTo(sx+10,gy-230); ctx.lineTo(sx+110,gy-275); ctx.lineTo(sx+210,gy-230); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#3a2a1a'; ctx.fillRect(sx+80,gy-290,20,30); ctx.fillRect(sx+76,gy-295,28,8);
  // Divisori piani
  ctx.fillStyle='#3a2a1a'; ctx.fillRect(sx,gy-82,HW,4); ctx.fillRect(sx+10,gy-163,HW-20,4);
  // Finestre rotte p1
  ctx.fillStyle='#0a0a0a'; ctx.fillRect(sx+15,gy-70,30,28); ctx.fillRect(sx+175,gy-70,30,28);
  ctx.strokeStyle='#444'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(sx+15,gy-70); ctx.lineTo(sx+45,gy-42); ctx.stroke();
  // Porta
  ctx.fillStyle='#2a1a0a'; ctx.fillRect(sx+90,gy-68,40,68);
  ctx.fillStyle='#8a6a1a'; ctx.fillRect(sx+124,gy-40,5,5);
  // Finestre p2
  ctx.fillStyle='#0a0808'; ctx.fillRect(sx+25,gy-150,28,24); ctx.fillRect(sx+167,gy-150,28,24);
  // Finestre p3
  ctx.fillStyle='#0a0808'; ctx.fillRect(sx+40,gy-220,25,20); ctx.fillRect(sx+155,gy-220,25,20);
  // SCAPPA se dentro
  if (l2.house1Entered && l2.snakeActive) {
    if (Math.floor(Date.now()/400)%2===0) {
      ctx.font='9px "Press Start 2P"'; ctx.fillStyle='#ff2222'; ctx.textAlign='center';
      ctx.fillText('⚠ SCAPPA! ⚠', sx+110, gy-240); ctx.textAlign='left';
    }
  }
}

function drawL2Snake(gy) {
  const sx = Math.round(sc(l2.snakeX));
  const t  = Date.now();
  const sl = Math.sin(t/200)*4;
  ctx.save(); ctx.translate(sx, gy);
  const p=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);};
  p(0,-12+sl,20,12,'#2a7a2a'); p(18,-10+sl*0.7,16,10,'#2a7a2a');
  p(32,-14+sl*0.4,16,10,'#2a7a2a'); p(46,-12+sl*0.2,14,10,'#2a7a2a');
  p(4,-10+sl,6,4,'#3a9a3a'); p(14,-10+sl,6,4,'#3a9a3a');
  p(-10,-14+sl,18,14,'#1a6a1a');
  p(-6,-12+sl,4,4,'#ff4400'); p(0,-12+sl,4,4,'#ff4400');
  p(-5,-11+sl,2,2,'#111'); p(1,-11+sl,2,2,'#111');
  if (Math.floor(t/300)%2===0) {
    p(-18,-9+sl,8,2,'#ff2222'); p(-24,-11+sl,4,2,'#ff2222'); p(-24,-7+sl,4,2,'#ff2222');
  }
  ctx.restore();
}

function drawL2TempleExterior(sx, gy) {
  const TW = l2.templeW;
  // Alberi dietro
  [sx-40, sx+TW*0.25, sx+TW*0.75, sx+TW+30].forEach(tx=>{
    if (tx < -60 || tx > W+60) return;
    ctx.fillStyle='#2d6b2d';
    ctx.beginPath(); ctx.arc(tx,gy-175,40,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#3a8a3a';
    ctx.beginPath(); ctx.arc(tx-12,gy-168,26,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#5a3a1a'; ctx.fillRect(tx-5,gy-138,10,70);
  });
  // Scalinata
  const stX=sx+TW*0.25, stW=TW*0.5;
  ctx.fillStyle='#b0aa98'; ctx.fillRect(stX-18,gy-22,stW+36,22);
  ctx.fillStyle='#a8a290'; ctx.fillRect(stX-8,gy-44,stW+16,24);
  ctx.fillStyle='#b0aa98'; ctx.fillRect(stX,gy-64,stW,22);
  // Muro
  ctx.fillStyle='#c8c0b0'; ctx.fillRect(sx+18,gy-200,TW-36,138);
  // Blocchi pietra
  ctx.strokeStyle='#a8a098'; ctx.lineWidth=1;
  for(let r=0;r<4;r++) for(let c=0;c<10;c++) {
    ctx.strokeRect(sx+20+c*(TW-40)/10, gy-198+r*34, (TW-40)/10-1, 33);
  }
  // Fregio
  ctx.fillStyle='#a8a098'; ctx.fillRect(sx+8,gy-208,TW-16,12);
  // Colonne
  for(let ci=0;ci<7;ci++) {
    const cx=sx+36+ci*(TW-72)/6;
    if (cx < -20 || cx > W+20) continue;
    ctx.fillStyle='#d0c8b8'; ctx.fillRect(cx-8,gy-200,16,138);
    ctx.fillStyle='#c0b8a8'; ctx.fillRect(cx-8,gy-200,3,138); ctx.fillRect(cx+5,gy-200,3,138);
    ctx.fillStyle='#bbb8a8'; ctx.fillRect(cx-14,gy-200,28,10); ctx.fillRect(cx-10,gy-211,20,12);
    // Rampicanti
    if (ci===0||ci===3||ci===6) {
      ctx.fillStyle='#2a7a2a';
      for(let vi=0;vi<7;vi++) ctx.fillRect(cx-4+Math.sin(vi)*3,gy-198+vi*26,6,18);
    }
  }
  // Porta centrale (ad arco)
  const doorX = sx + TW/2 - 28;
  ctx.fillStyle='#1a1510';
  ctx.fillRect(doorX, gy-148, 56, 85);
  ctx.beginPath(); ctx.arc(doorX+28,gy-148,28,Math.PI,0); ctx.fill();
  // Luce porta
  const grd=ctx.createRadialGradient(doorX+28,gy-100,4,doorX+28,gy-100,44);
  grd.addColorStop(0,'rgba(255,200,100,0.18)'); grd.addColorStop(1,'transparent');
  ctx.fillStyle=grd; ctx.fillRect(doorX-8,gy-160,72,95);
  // Vegetazione terra
  ctx.fillStyle='#3a7a3a';
  for(let gi=0;gi<14;gi++) { const gx2=sx+gi*(TW/14); if(gx2>-10&&gx2<W+10){ctx.fillRect(gx2,gy-16,7,16);ctx.fillRect(gx2+2,gy-22,4,8);} }
  // Massi
  [[sx+25,gy-18,20,14],[sx+TW-50,gy-16,26,12]].forEach(([rx,ry,rw,rh])=>{
    ctx.fillStyle='#9a9488'; ctx.fillRect(rx,ry,rw,rh);
    ctx.fillStyle='#aaa498'; ctx.fillRect(rx+2,ry+2,rw-4,4);
  });
  // Cultisti
  [TW*0.12,TW*0.22,TW*0.55,TW*0.68,TW*0.82].forEach(ox=>{
    const cx2=sx+ox; if(cx2<-20||cx2>W+20)return;
    const sw=Math.sin(Date.now()/1400+ox)*2;
    ctx.fillStyle='#f0f0f0';
    ctx.fillRect(cx2-5,gy-55+sw,10,28); ctx.fillRect(cx2-6,gy-80+sw,12,27);
    ctx.fillStyle='#e0e0e0'; ctx.fillRect(cx2-7,gy-82+sw,14,8);
    ctx.fillStyle='#ccc'; ctx.fillRect(cx2-3,gy-74+sw,3,3); ctx.fillRect(cx2,gy-74+sw,3,3);
  });
}

function drawL2Temple(gy) {
  // Stanza interna del tempio
  const grad=ctx.createLinearGradient(0,0,0,gy);
  grad.addColorStop(0,'#1e1a14'); grad.addColorStop(0.6,'#2a2418'); grad.addColorStop(1,'#181208');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,gy);
  // Pavimento
  ctx.fillStyle='#4a4030'; ctx.fillRect(0,gy,W,8);
  ctx.fillStyle='#5a5040';
  for(let tx=0;tx<W;tx+=44) ctx.fillRect(tx,gy,42,8);
  ctx.fillStyle='#3a3020'; ctx.fillRect(0,gy+8,W,H-gy-8);
  // Muri
  ctx.fillStyle='#3a3428'; ctx.fillRect(0,0,28,gy); ctx.fillRect(W-28,0,28,gy);
  // Colonne
  [[22,'#4a4438'],[W-22,'#4a4438']].forEach(([cx,col])=>{
    ctx.fillStyle=col; ctx.fillRect(cx-10,gy*0.08,20,gy*0.86);
    ctx.fillStyle='#5a5448'; ctx.fillRect(cx-16,gy*0.08,32,12);
  });
  // Torce
  const tf=Math.sin(Date.now()/150)*0.25+0.75;
  [W*0.22,W*0.78].forEach(tx=>{
    ctx.fillStyle='#6a4020'; ctx.fillRect(tx-3,gy*0.28,6,22);
    ctx.fillStyle=`rgba(255,150,30,${tf})`; ctx.beginPath(); ctx.arc(tx,gy*0.28,13,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=`rgba(255,220,100,${tf*0.5})`; ctx.beginPath(); ctx.arc(tx,gy*0.28,22,0,Math.PI*2); ctx.fill();
  });
  // Rune
  ctx.fillStyle='#7a6a50'; ctx.font='15px serif'; ctx.textAlign='center';
  ['☽','✦','⊕','✦','☾'].forEach((s,i)=>ctx.fillText(s,W*0.15+i*(W*0.7/4),gy*0.22));
  ctx.textAlign='left';
  // Porta uscita sinistra
  ctx.fillStyle='#0e0a06'; ctx.fillRect(28,gy-128,52,128);
  ctx.beginPath(); ctx.arc(54,gy-128,26,Math.PI,0); ctx.fill();
  const grd2=ctx.createRadialGradient(54,gy-70,4,54,gy-70,70);
  grd2.addColorStop(0,'rgba(80,160,60,0.22)'); grd2.addColorStop(1,'transparent');
  ctx.fillStyle=grd2; ctx.fillRect(0,gy-155,130,155);
  // Guru
  drawL2Guru(gy);
  // Palle
  l2.guruBalls.forEach(b=>{
    b.trail.forEach((pt,i)=>{
      ctx.fillStyle=`rgba(255,220,50,${i/b.trail.length*0.35})`;
      const ts=Math.max(1,(b.size||10)*i/b.trail.length)|0;
      ctx.fillRect(Math.round(pt.x)-ts/2,Math.round(pt.y)-ts/2,ts,ts);
    });
    ctx.fillStyle='rgba(255,255,180,0.3)'; ctx.beginPath(); ctx.arc(Math.round(b.x),Math.round(b.y),16,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffffaa'; ctx.beginPath(); ctx.arc(Math.round(b.x),Math.round(b.y),10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(Math.round(b.x)-3,Math.round(b.y)-3,4,0,Math.PI*2); ctx.fill();
  });
  drawParticles();
  drawIliaHair(true);
  drawCarlo();
  // Hint scappa
  if (l2.guruState==='angry') {
    ctx.font='9px "Press Start 2P"'; ctx.fillStyle='#ff2222'; ctx.textAlign='center';
    if (Math.floor(Date.now()/300)%2===0) ctx.fillText('◀ SCAPPA DALLA PORTA! ◀',W/2,90);
    ctx.textAlign='left';
  }
}

function drawL2Guru(gy) {
  if (l2.guruState==='idle') return;
  const angry = l2.guruState==='angry';
  const t = Date.now();
  const bob = Math.sin(t/400)*3;
  const scale = angry ? 1.55 : 1;
  const gx = W*0.65, gy2=gy;
  ctx.save(); ctx.translate(Math.round(gx), Math.round(gy2)); ctx.scale(scale,scale);
  const p=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);};
  // Veste
  p(-18,-80+bob,36,60,'#f5f5f5'); p(-22,-60+bob,44,40,'#f0f0f0');
  // Barba
  p(-10,-50+bob,20,50,'#fff'); p(-8,-30+bob,16,48,'#f0f0f0');
  p(-6,-10+bob,12,28,'#fff'); p(-4,8+bob,8,18,'#f5f5f5');
  // Testa
  p(-14,-120+bob,28,32,'#fde8c8');
  // Capelli bianchi
  p(-16,-122+bob,32,10,'#fff'); p(-18,-120+bob,6,20,'#fff'); p(12,-120+bob,6,20,'#fff');
  // Occhi
  if (!angry) {
    p(-8,-112+bob,6,6,'#2a1a0e'); p(2,-112+bob,6,6,'#2a1a0e');
    p(-7,-111+bob,3,3,'#fff'); p(3,-111+bob,3,3,'#fff');
    p(-6,-102+bob,12,3,'#c08060'); p(-4,-99+bob,8,3,'#c08060');
  } else {
    p(-10,-114+bob,8,8,'#ff2200'); p(2,-114+bob,8,8,'#ff2200');
    const rl=28+Math.sin(t/80)*8;
    ctx.fillStyle='rgba(255,200,0,0.85)'; ctx.fillRect(-10,-114+bob,rl,4); ctx.fillRect(10,-114+bob,-rl,4);
    p(-10,-100+bob,20,8,'#aa0000'); p(-7,-98+bob,14,6,'#ffaaaa');
    if (Math.floor(t/150)%2===0){ctx.strokeStyle='#ff4400';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-70+bob,52,0,Math.PI*2);ctx.stroke();}
    p(-35,-85+bob,20,10,'#f5f5f5'); p(15,-85+bob,20,10,'#f5f5f5');
  }
  ctx.restore();
  // Label/dialog
  if (!angry) {
    const dialogs=[
      'BENVENUTI! Questo e\' il\nCULTO DELLA COLLINA\nDI LIMBIATE',
      'Dalla vostra eta\' e\nprestanza fisica...\nSareste OTTIMI ADEPTI!'
    ];
    const txt = dialogs[l2.guruDialog] || dialogs[1];
    if (l2.guruState==='dialog') {
      const bx=16,by=62,bw=W-32,bh=128;
      ctx.fillStyle='rgba(238,234,225,0.96)'; ctx.fillRect(bx,by,bw,bh);
      ctx.strokeStyle='#aaa'; ctx.lineWidth=2; ctx.strokeRect(bx,by,bw,bh);
      ctx.font='7px "Press Start 2P"'; ctx.fillStyle='#555'; ctx.fillText('GURU:',bx+10,by+20);
      ctx.fillStyle='#111';
      txt.split('\n').forEach((line,i)=>ctx.fillText(line,bx+10,by+42+i*24));
      if (Math.floor(Date.now()/450)%2===0){ctx.font='6px "Press Start 2P"';ctx.fillStyle='#999';ctx.textAlign='right';ctx.fillText('tocca ▶',bx+bw-10,by+bh-10);ctx.textAlign='left';}
    }
  } else {
    if (Math.floor(t/300)%2===0){ctx.font='8px "Press Start 2P"';ctx.fillStyle='#ff2200';ctx.textAlign='center';ctx.fillText('ERESIA!!!',gx,gy-200);ctx.textAlign='left';}
  }
}


loop();
</script>
